<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 - 주문서</title>
  <!-- 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS v2 라이브러리 CDN 연결 (script.js보다 먼저 로드) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 자바스크립트 연결 -->
  <script src="script.js" defer></script>
</head>
<body>
  <!-- [페이지 상단] 카페 헤더 -->
  <header>
    <!-- 카페 로고: ☕ 이모지 크게 -->
    <div class="logo">☕</div>
    <!-- 카페 이름 -->
    <h1>바이브 카페</h1>
    <!-- 부제 -->
    <p>당신의 하루에 바이브를 더하다</p>
  </header>

  <main>
    <!-- [탭 메뉴] 주문하기 및 주문 내역 전환 -->
    <nav class="tab-menu" aria-label="메뉴 탭">
      <button type="button" class="tab-btn active" id="tab-order-btn">☕ 주문하기</button>
      <button type="button" class="tab-btn" id="tab-history-btn">
        📋 주문 내역 <span class="badge" id="order-count-badge">0</span>
      </button>
    </nav>

    <!-- [탭 1] 주문하기 탭 패널 -->
    <div id="order-tab-panel" class="tab-panel">
      <form id="order-form" novalidate>
      <!-- 1. 이름 (필수, text) -->
      <section class="form-group">
        <label for="customer-name">이름 (필수)</label>
        <input type="text" id="customer-name" name="customerName" placeholder="주문자 성함을 입력해주세요">
      </section>

      <!-- 2. 전화번호 (tel) -->
      <section class="form-group">
        <label for="customer-phone">전화번호</label>
        <input type="tel" id="customer-phone" name="customerPhone" placeholder="010-0000-0000">
      </section>

      <!-- 3. 음료 선택 (드롭다운) 및 12. 딸기 스무디 -->
      <section class="form-group">
        <label for="beverage-select">음료 선택</label>
        <select id="beverage-select" name="beverage">
          <option value="" data-price="0">-- 음료를 선택하세요 --</option>
          <option value="americano" data-price="3500">아메리카노 (3,500원)</option>
          <option value="latte" data-price="4000">카페라떼 (4,000원)</option>
          <option value="mocha" data-price="4500">카페모카 (4,500원)</option>
          <option value="vanilla-latte" data-price="4500">바닐라라떼 (4,500원)</option>
          <option value="greentea-latte" data-price="4500">녹차라떼 (4,500원)</option>
          <!-- 딸기 스무디는 사이즈/추가 옵션 없이 수량만 선택 가능 (JS로 제어 예정) -->
          <option value="strawberry-smoothie" data-price="5500" data-no-options="true">딸기 스무디 (5,500원)</option>
        </select>
      </section>

      <!-- 4. 사이즈 (라디오) -->
      <fieldset class="form-group" id="size-section">
        <legend>사이즈</legend>
        <input type="radio" id="size-s" name="size" value="S" data-price="0">
        <label for="size-s">S (+0원)</label>

        <input type="radio" id="size-m" name="size" value="M" data-price="500" checked>
        <label for="size-m">M (+500원)</label>

        <input type="radio" id="size-l" name="size" value="L" data-price="1000">
        <label for="size-l">L (+1,000원)</label>
      </fieldset>

      <!-- 5. 추가 옵션 (체크박스) -->
      <fieldset class="form-group" id="options-section">
        <legend>추가 옵션</legend>
        <input type="checkbox" id="option-shot" name="option" value="shot" data-price="500">
        <label for="option-shot">샷 추가 (+500원)</label>

        <input type="checkbox" id="option-cream" name="option" value="cream" data-price="500">
        <label for="option-cream">크림 추가 (+500원)</label>

        <input type="checkbox" id="option-syrup" name="option" value="syrup" data-price="300">
        <label for="option-syrup">시럽 추가 (+300원)</label>

        <input type="checkbox" id="option-decaf" name="option" value="decaf" data-price="0">
        <label for="option-decaf">디카페인 (+0원)</label>
      </fieldset>

      <!-- 6. 수량 (number, 최소 1, 최대 10, 기본값 1) -->
      <section class="form-group">
        <label for="order-quantity">수량</label>
        <input type="number" id="order-quantity" name="quantity" min="1" max="10" value="1">
      </section>

      <!-- 7. 요청사항 (textarea) -->
      <section class="form-group">
        <label for="order-requests">요청사항</label>
        <textarea id="order-requests" name="requests" rows="4" placeholder="요청사항이 있으시면 적어주세요"></textarea>
      </section>

      <!-- 8. 예상 금액 표시 영역 -->
      <section class="form-group" id="estimated-price-area">
        <p>예상 금액: <span id="total-price" data-price="0">0원</span></p>
      </section>

      <!-- 버튼 영역 (9. 주문하기, 10. 다시 작성) -->
      <section class="form-buttons">
        <button type="submit" id="submit-button">주문하기</button>
        <button type="reset" id="reset-button">다시 작성</button>
      </section>
    </form>

    <!-- 11. 주문 확인 메시지가 나올 빈 영역 (초기 상태 숨김) -->
      <section id="order-confirmation" hidden></section>
    </div>

    <!-- [탭 2] 주문 내역 탭 패널 (초기 상태 숨김: hidden 클래스 사용) -->
    <div id="history-tab-panel" class="tab-panel hidden">
      <!-- 주문 내역 목록이 동적으로 들어갈 영역 -->
      <div id="orders-list"></div>

      <!-- 하단 주문 내역 요약 정보 및 내역 모두 지우기 버튼 -->
      <div id="orders-summary-area" class="orders-summary-area hidden">
        <p id="orders-total-summary">총 주문 금액: 0원 (0건)</p>
        <button type="button" id="clear-orders-btn">내역 모두 지우기</button>
      </div>
    </div>
  </main>
</body>
</html>
